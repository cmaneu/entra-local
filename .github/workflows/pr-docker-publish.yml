# PR Docker Publish: when a maintainer comments `/docker-publish`, `/docker publish`, or
# `#docker publish` on a pull request, build the Docker image from the PR head commit and
# push it to the GitHub Container Registry tagged with the commit SHA and PR-specific tags.
# `/docker-unpublish` or closing the PR deletes every image version published for that PR.
name: PR Docker Publish

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]

# Write packages to push/delete GHCR images; write pull-requests to post the result comment.
permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  docker-publish-prepare:
    # Only run for PR comments (issues lack the `pull_request` key) that contain one of the
    # recognised trigger phrases. GitHub Actions `contains()` is case-insensitive by default.
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      (
        contains(github.event.comment.body, '/docker-publish') ||
        contains(github.event.comment.body, '/docker publish') ||
        contains(github.event.comment.body, '#docker publish')
      )
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      number: ${{ steps.pr.outputs.number }}
      image: ${{ steps.meta.outputs.image }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      pr_tag: ${{ steps.meta.outputs.pr_tag }}
      version_tag: ${{ steps.meta.outputs.version_tag }}
    steps:
      # Acknowledge the trigger immediately by reacting with 👀 on the comment so the author
      # knows the build has kicked in, even before the (slower) image build starts.
      - name: React to trigger comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes

      # The `issue_comment` event runs in the default-branch context; look up the PR head SHA
      # explicitly so we check out (and build) the actual PR commit.
      - name: Resolve PR head SHA and number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "${{ github.event.issue.pull_request.url }}" --jq '.head.sha')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"

      - name: Derive image name, short SHA, and PR tag
        id: meta
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          sha="${{ steps.pr.outputs.sha }}"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "pr_tag=dev-pr-${{ steps.pr.outputs.number }}" >> "$GITHUB_OUTPUT"
          echo "version_tag=dev-pr-${{ steps.pr.outputs.number }}-${sha}" >> "$GITHUB_OUTPUT"

  # Build each platform on a native runner and push it by digest. The publish job adds the tags.
  docker-publish-build:
    needs: docker-publish-prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.docker-publish-prepare.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push ${{ matrix.platform }} image by digest
        shell: bash
        run: |
          image="${{ needs.docker-publish-prepare.outputs.image }}"
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --output "type=image,name=$image,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/build-metadata.json .
          mkdir -p /tmp/digests
          digest=$(jq -r '."containerimage.digest"' /tmp/build-metadata.json)
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload ${{ matrix.platform }} digest
        uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    needs: [docker-publish-prepare, docker-publish-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Publish one multi-platform image index with the full commit SHA, the PR mutable tag,
      # and a persistent PR-version tag. Cleanup continues to find all versions by those tags.
      # Never move or create the `latest` tag.
      - name: Publish multi-platform image tags
        shell: bash
        run: |
          image="${{ needs.docker-publish-prepare.outputs.image }}"
          sha="${{ needs.docker-publish-prepare.outputs.sha }}"
          pr_tag="${{ needs.docker-publish-prepare.outputs.pr_tag }}"
          version_tag="${{ needs.docker-publish-prepare.outputs.version_tag }}"
          sources=()
          for digest_file in /tmp/digests/*; do
            sources+=("$image@sha256:$(basename "$digest_file")")
          done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "Expected 2 platform digests, found ${#sources[@]}." >&2
            exit 1
          fi
          docker buildx imagetools create \
            --tag "$image:$sha" \
            --tag "$image:$pr_tag" \
            --tag "$image:$version_tag" \
            "${sources[@]}"
          docker buildx imagetools inspect "$image:$version_tag"

      # Report the published reference back to the PR so reviewers can pull it immediately.
      # Write the body to a temp file to avoid shell quoting issues with the multi-line string.
      - name: Comment on PR with image reference
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          image="${{ needs.docker-publish-prepare.outputs.image }}"
          sha="${{ needs.docker-publish-prepare.outputs.sha }}"
          short_sha="${{ needs.docker-publish-prepare.outputs.short_sha }}"
          pr_tag="${{ needs.docker-publish-prepare.outputs.pr_tag }}"
          pr_number="${{ needs.docker-publish-prepare.outputs.number }}"
          body_file=$(mktemp)
          {
            echo "🐳 Docker image published for commit \`${short_sha}\` (PR #${pr_number}):"
            echo ""
            echo '```bash'
            echo "docker pull ${image}:${pr_tag}"
            echo "docker run -p 8443:8443 -v entra-local-data:/app/data ${image}:${pr_tag}"
            echo '```'
            echo ""
            echo "Tagged as:"
            echo "- \`${image}:${pr_tag}\` — always points to the latest publish for this PR"
            echo "- \`${image}:${sha}\` — pinned to this exact commit"
            echo ""
            echo "> These dev images are deleted automatically when the PR is closed."
          } > "$body_file"
          gh pr comment "$pr_number" \
            --repo "${{ github.repository }}" \
            --body-file "$body_file"
          rm -f "$body_file"

  # Delete every package version published for a PR on command or whenever the PR is closed.
  docker-cleanup:
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.action == 'closed'
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '/docker-unpublish')
      )
    runs-on: ubuntu-latest
    steps:
      - name: React to unpublish comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes

      - name: Resolve PR number
        id: pr
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Delete PR image versions from GHCR
        id: cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          package_name="${GITHUB_REPOSITORY#*/}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          pr_tag="dev-pr-${{ steps.pr.outputs.number }}"
          owner_type=$(gh api "/repos/${GITHUB_REPOSITORY}" --jq '.owner.type')

          if [ "$owner_type" = "Organization" ]; then
            base_url="/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${package_name}"
          else
            # Use the owner-qualified API; the workflow actor need not be the package owner.
            base_url="/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${package_name}"
          fi

          versions_file=$(mktemp)
          gh api --paginate "${base_url}/versions" --jq '.[] | @json' > "$versions_file"

          # Each tagged multi-platform image points to untagged platform images. Collect those
          # digests so cleanup removes the full PR image, but keep any digest still used by an
          # image that is not tagged for this PR.
          child_digests() {
            docker buildx imagetools inspect --raw "$image@$1" 2>/dev/null \
              | jq -r '.manifests[]?.digest' || true
          }
          # shellcheck disable=SC2016 # `$pr_tag` is a jq variable, not a shell variable.
          is_pr_version='any(.metadata.container.tags[]?; . == $pr_tag or startswith($pr_tag + "-"))'
          pr_digests=$(jq -r --arg pr_tag "$pr_tag" "select($is_pr_version) | .name" "$versions_file")
          other_digests=$(jq -r --arg pr_tag "$pr_tag" \
            "select((.metadata.container.tags | length) > 0 and ($is_pr_version | not)) | .name" \
            "$versions_file")

          delete_digests=$(
            {
              printf '%s\n' "$pr_digests"
              while read -r digest; do
                if [ -n "$digest" ]; then child_digests "$digest"; fi
              done <<< "$pr_digests"
            } | sed '/^$/d' | sort -u
          )
          protected_digests=$(
            while read -r digest; do
              if [ -n "$digest" ]; then child_digests "$digest"; fi
            done <<< "$other_digests" | sed '/^$/d' | sort -u
          )
          if [ -n "$protected_digests" ]; then
            delete_digests=$(comm -23 <(printf '%s\n' "$delete_digests") <(printf '%s\n' "$protected_digests"))
          fi

          # Delete package versions, not individual tags. The exact mutable tag finds the
          # latest image; the persistent prefix finds every earlier image for the PR. Delete
          # tagged images before their platform images.
          # shellcheck disable=SC2016 # `$name` and `$digests` are jq variables.
          select_digests='select(.name as $name | $digests | split("\n") | any(. == $name))'
          version_ids=$(
            jq -r --arg pr_tag "$pr_tag" --rawfile digests <(printf '%s\n' "$delete_digests") \
              "$select_digests | select($is_pr_version) | .id" "$versions_file"
            jq -r --arg pr_tag "$pr_tag" --rawfile digests <(printf '%s\n' "$delete_digests") \
              "$select_digests | select($is_pr_version | not) | .id" "$versions_file"
          )
          rm -f "$versions_file"

          if [ -z "$version_ids" ]; then
            echo "No image versions found for tag ${pr_tag} — nothing to delete."
            echo "deleted=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          deleted=0
          while read -r id; do
            echo "Deleting package version ${id} for PR #${{ steps.pr.outputs.number }}"
            gh api --method DELETE "${base_url}/versions/${id}"
            deleted=$((deleted + 1))
          done <<< "$version_ids"
          echo "deleted=${deleted}" >> "$GITHUB_OUTPUT"
          echo "Deleted ${deleted} package version(s) for PR #${{ steps.pr.outputs.number }}."

      - name: Comment on PR with cleanup result
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ steps.pr.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --body "🐳 Deleted ${{ steps.cleanup.outputs.deleted }} Docker package version(s) for this PR."
