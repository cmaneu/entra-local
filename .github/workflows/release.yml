# Release (#1): when a GitHub Release is published, build & test the project, then publish the
# distributable artifacts — the single-file executables (one per OS, attached to the Release) and
# the Docker image (pushed to the GitHub Container Registry, part of GitHub Packages).
name: Release

on:
  release:
    types: [published]
  # Manual dry-run: builds and (for a real tag) can re-publish. Upload/push steps are guarded to
  # the `release` event so a dispatch run validates the build without needing an existing Release.
  workflow_dispatch:

# Least-privilege: write Release assets (binaries) and push packages (the GHCR image).
permissions:
  contents: write
  packages: write

env:
  NODE_ENV: test
  TENANT_ID: '11111111-1111-1111-1111-111111111111'

jobs:
  # Gate the release on the same lint/typecheck/build/test bar as CI before anything is published.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Unit + integration tests
        run: pnpm test

  # Build the self-contained single-file binary on each OS (Node SEA does not cross-compile),
  # smoke-test it, and attach it to the published Release. Maps to feature #17's run target.
  binaries:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: entra-local
            asset: entra-local-linux-x64
          - os: windows-latest
            bin: entra-local.exe
            asset: entra-local-windows-x64.exe
          - os: macos-latest
            bin: entra-local
            asset: entra-local-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stamp the published Release's tag into package.json so the shipped binary reports the real
      # release version at /health (and in the portal) instead of the in-repo placeholder. SEA
      # embeds package.json at blob-generation time, so this must precede the build below.
      - name: Stamp release version into package.json
        if: github.event_name == 'release'
        shell: bash
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Build server + portal
        run: pnpm run build

      - name: Build single-file executable (Node SEA)
        run: pnpm run build:sea

      - name: Smoke-test the binary
        run: npx vitest run --config vitest.config.ts test/integration/sea-packaging.test.ts

      # Rename to an OS-qualified asset name so the three platform binaries don't collide on the
      # Release. `gh release upload` uses the repo's GITHUB_TOKEN — no third-party action needed.
      - name: Stage binary as ${{ matrix.asset }} (POSIX)
        if: runner.os != 'Windows'
        run: cp "dist-sea/${{ matrix.bin }}" "dist-sea/${{ matrix.asset }}"

      - name: Stage binary as ${{ matrix.asset }} (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item "dist-sea/${{ matrix.bin }}" "dist-sea/${{ matrix.asset }}"
        shell: pwsh

      - name: Upload binary to the Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist-sea/${{ matrix.asset }}" --clobber

  # Build the hardened runtime image on a native runner for each platform. A release pushes each
  # platform image by digest; the `docker` job then joins them under the user-facing tags.
  docker-build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive image name (lowercase) and version tag
        id: meta
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          echo "version=${version:-dev}" >> "$GITHUB_OUTPUT"

      # Stamp the published Release's tag into package.json BEFORE building: the Dockerfile copies
      # package.json into the runtime image, so the container reports the real release version at
      # /health (and in the portal) instead of the in-repo placeholder.
      - name: Stamp release version into package.json
        if: github.event_name == 'release'
        run: npm version "${{ steps.meta.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'release'
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build ${{ matrix.platform }} image
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            docker buildx build \
              --platform "${{ matrix.platform }}" \
              --output "type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file /tmp/build-metadata.json .
            mkdir -p /tmp/digests
            digest=$(jq -r '."containerimage.digest"' /tmp/build-metadata.json)
            touch "/tmp/digests/${digest#sha256:}"
          else
            # Keep workflow_dispatch as a build-only dry-run; do not push any image.
            docker buildx build \
              --platform "${{ matrix.platform }}" \
              --output "type=oci,dest=/tmp/entra-local-${{ matrix.arch }}.tar" .
          fi

      - name: Upload ${{ matrix.platform }} digest
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Join the platform images into one multi-platform image under the release tags.
  docker:
    needs: docker-build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish multi-platform image tags
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${RELEASE_TAG#v}"
          tags=(--tag "$image:$version")
          # Only publish :latest for a full (non-prerelease) Release.
          if [ "$RELEASE_PRERELEASE" != "true" ]; then
            tags+=(--tag "$image:latest")
          fi
          sources=()
          for digest_file in /tmp/digests/*; do
            sources+=("$image@sha256:$(basename "$digest_file")")
          done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "Expected 2 platform digests, found ${#sources[@]}." >&2
            exit 1
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$image:$version"
